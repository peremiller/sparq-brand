name: SPARQ Brand quality

on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/sparq-brand-quality.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-and-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/resume-contract.test.mjs
